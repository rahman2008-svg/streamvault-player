workflows:
  android-workflow:
    name: StreamVault Android Build Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17

      vars:
        PACKAGE_NAME: "com.aistudio.streamvault.player.kvprqx"
        GRADLE_OPTS: "-Xmx4096m"

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:
      - name: Checkout cleanup
        script: |
          echo "Preparing build..."

      - name: Set up local properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant Gradle permissions
        script: |
          chmod +x gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Run build check
        script: |
          ./gradlew tasks

      - name: Build Debug APK (SAFE)
        script: |
          ./gradlew assembleDebug

      - name: Build Release APK & AAB
        script: |
          ./gradlew assembleRelease bundleRelease

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab

    publishing:
      email:
        recipients:
          - princearabdurrahman57@gmail.com
        notify:
          success: true
          failure: true
