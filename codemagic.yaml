workflows:
  android-workflow:
    name: StreamVault Stable Build Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17

      vars:
        PACKAGE_NAME: "com.aistudio.streamvault.player.kvprqx"
        GRADLE_OPTS: "-Xmx4096m"

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:

      - name: Start build log
        script: |
          echo "🚀 StreamVault build starting..."

      - name: Setup local properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant permissions
        script: |
          chmod +x gradlew

      - name: Clean project
        script: |
          ./gradlew clean

      - name: Validate Gradle setup
        script: |
          ./gradlew tasks

      - name: Build Debug APK (SAFE)
        script: |
          ./gradlew assembleDebug

      - name: Build Release APK (SAFE SIGNING)
        script: |
          ./gradlew assembleRelease

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab

    publishing:
      email:
        recipients:
          - princearabdurrahman57@gmail.com
        notify:
          success: true
          failure: true
