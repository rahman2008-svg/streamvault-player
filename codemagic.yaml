workflows:
  android-workflow:
    name: Android Apps Build Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17

      vars:
        PACKAGE_NAME: "com.aistudio.streamvault.player.kvprqx"

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: "*"
          include: true

    scripts:
      - name: Set up local properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant permissions
        script: |
          chmod +x gradlew

      - name: Validate Gradle wrapper
        script: |
          ./gradlew tasks

      - name: Build Release APK & AAB
        script: |
          ./gradlew assembleRelease bundleRelease

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/bundle/**/*.aab

    publishing:
      email:
        recipients:
          - princearabdurrahman57@gmail.com
        notify:
          success: true
          failure: true
